# Task runner entry points. `mise tasks` lists them, `mise run <name>` runs one.
#
# mise is not required to work on this repository. Every task here is a
# thin wrapper over a command CLAUDE.md already documents, and running
# that command directly does the same thing — the wrappers exist so the
# workflows that get repeated are one word instead of a path and a set
# of flags to remember.
#
# The build's administration is one script behind one verb per task
# (`apps/spell-circle-canvas/scripts/sigil.py <verb>`; its README is the
# canon and `--help` on a verb is the canon for its flags), so anything
# after `--` is forwarded to the verb:
#
#     mise run check -- --fix
#     mise run sanitize -- --lane thread
#     mise run plates -- --tier device
#
# The two tasks that pick a build configuration declare it in `usage`
# instead, and a task that declares its own arguments CANNOT forward.

# ---------------------------------------------------------------------------
# Build and run
#
# One build tree, several configurations: the generator is Ninja
# Multi-Config, so `--config` selects among them rather than each getting
# its own directory. Binaries land in build/bin/<config>/.

[tasks.build]
description = "Configure and build the application (--config Release|Debug|RelWithDebInfo)"
dir = "apps/spell-circle-canvas"
usage = '''
flag "--config <config>" help="build configuration" default="Release" {
  choices "Debug" "Release" "RelWithDebInfo"
}
'''
run = 'python3 scripts/sigil.py setup --config "${usage_config:-Release}"'

[tasks.app]
description = "Build and launch SpellCircle (--config Release|Debug|RelWithDebInfo)"
dir = "apps/spell-circle-canvas"
usage = '''
flag "--config <config>" help="build configuration" default="Release" {
  choices "Debug" "Release" "RelWithDebInfo"
}
'''
run = '''
set -e
config="${usage_config:-Release}"
python3 scripts/sigil.py setup --config "$config"
# A macOS bundle: `open` gives it a proper application activation rather
# than the console-app treatment the bare binary gets.
open "build/bin/$config/SpellCircle.app"
'''

# ---------------------------------------------------------------------------
# Tests
#
# Two tasks rather than one with a --config flag: extra arguments after
# `--` are forwarded to ctest, and a task that declares its own flags
# cannot also forward. Filtering tests is worth more than the flag.
#
#     mise run test -- -R compose
#     mise run test -- --rerun-failed

[tasks.test]
description = "Run the Release test suite (extra args go to ctest, after --)"
dir = "apps/spell-circle-canvas"
depends = ["build --config Release"]
run = "ctest --test-dir build -C Release --output-on-failure"

[tasks."test:debug"]
description = "Run the Debug test suite (extra args go to ctest, after --)"
dir = "apps/spell-circle-canvas"
depends = ["build --config Debug"]
run = "ctest --test-dir build -C Debug --output-on-failure"

# ---------------------------------------------------------------------------
# Checks

[tasks.check]
description = "Format and lint the branch's work (args go to the check verb)"
dir = "apps/spell-circle-canvas"
run = "python3 scripts/sigil.py check"

[tasks.sanitize]
description = "ASan+UBSan build and test run; --lane thread for TSan"
dir = "apps/spell-circle-canvas"
run = "python3 scripts/sigil.py sanitize"

[tasks.coverage]
description = "Instrumented build, test run and llvm-cov report"
dir = "apps/spell-circle-canvas"
run = "python3 scripts/sigil.py sanitize --lane coverage"

# ---------------------------------------------------------------------------
# Visual and performance work
#
# Release throughout: Debug timings say nothing about this code, and the
# plate ledger compares rendered bytes from a build whose optimisation
# settings have to be the ones the baseline was taken with. Each of these
# runs a binary the build produces without building it, so the target
# comes first.

[tasks.plates]
description = "Plate sweep over the sketch registry in Release (args go to the plates verb)"
dir = "apps/spell-circle-canvas"
run = '''
set -e
cmake --build build --config Release --target Sketchbook
python3 scripts/sigil.py plates
'''

[tasks.bench]
description = "Timing sweep over the benchmark binaries (args go to the bench verb)"
dir = "apps/spell-circle-canvas"
run = '''
set -e
cmake --build build --config Release --target benches
python3 scripts/sigil.py bench
'''

[tasks.fps]
description = "Presented-frame-rate sweep in the real window (args go to the bench verb)"
dir = "apps/spell-circle-canvas"
# It opens a real window and presents each sketch in it, so the machine
# has to be quiet AND the window has to be able to present — a compositor
# busy with something else is measured along with the sketch.
run = '''
set -e
cmake --build build --config Release --target Sketchbook
python3 scripts/sigil.py bench --lane fps
'''

[tasks.sketch]
description = "Launch Sketchbook, the live sketch host (args go to it, after --)"
dir = "apps/spell-circle-canvas"
run = '''
set -e
cmake --build build --config Release --target Sketchbook
exec build/bin/Release/Sketchbook.app/Contents/MacOS/Sketchbook
'''

# ---------------------------------------------------------------------------
# Documentation, generated files and assets

[tasks.docs]
description = "Build the API documentation and open it (--serve serves it instead)"
dir = "apps/spell-circle-canvas"
run = "python3 scripts/sigil.py docs"

[tasks.flatbuffers]
description = "Regenerate the committed Python schema modules from SpellCircle.fbs"
dir = "apps/spell-circle-canvas"
# The C++ header is generated by the build and is not committed, so it is
# neither an input nor an output here.
sources = ["src/spellcircle/shared/schema/SpellCircle.fbs"]
outputs = ["../python/SpellCircle/Scene.py"]
run = "python3 scripts/sigil.py flatbuffers"

[tasks.assets]
description = "Fetch the demo assets into build/assets (--stage <archive> stages an SDK instead)"
dir = "apps/spell-circle-canvas"
# The fetcher only writes files, so this works on a fresh checkout with
# no configured build tree.
run = "python3 scripts/sigil.py assets"
