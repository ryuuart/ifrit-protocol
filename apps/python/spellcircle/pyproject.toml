[project]
name = "ifrit-protocol-apps"
version = "0.2.0"
description = "SpellCircle scene model, FlatBuffers codec and network API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flatbuffers"]

[project.scripts]
spellcircle = "SpellCircle.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["SpellCircle*"]

[tool.setuptools.package-data]
SpellCircle = ["py.typed"]
