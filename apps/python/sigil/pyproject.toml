[build-system]
requires = [
  "scikit-build-core>=1.0",
  "pybind11>=3.0",
  "delocate>=0.13; sys_platform == 'darwin'",
]
build-backend = "backend"
backend-path = ["packaging"]

[project]
name = "sigil-sketch"
version = "0.1.0a9"
description = "Native Sigil drawing libraries and headless Python sketches"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["COPYING", "COPYING.LESSER"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Graphics",
]

[project.scripts]
sigil = "sigil.cli:main"

[project.optional-dependencies]
studies = ["numpy>=2.0"]

[dependency-groups]
typing = ["basedpyright==1.40.1", "pybind11-stubgen==2.5.5"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.31"
cmake.build-type = "Release"
cmake.source-dir = "native"
build.targets = ["sigil_python"]
install.components = ["SigilPython"]
wheel.packages = ["sigil"]
editable.mode = "redirect"
sdist.exclude = [
  "build*", "dist", ".venv*", "CMakeUserPresets.json",
  ".claude/**", ".codex/**", ".agents/**", "**/.DS_Store", "**/.qmlls.ini",
  "**/__pycache__/**", "**/*.pyc",
]

[tool.scikit-build.cmake.define]
CMAKE_DISABLE_FIND_PACKAGE_Ultralight = true
CMAKE_DISABLE_FIND_PACKAGE_Substance = true
