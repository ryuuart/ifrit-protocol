[build-system]
requires = [
  "scikit-build-core>=1.0",
  "pybind11>=3.0",
  # The declarations an editor reads are written while the extension is
  # built, from the extension itself, and are in no source tree to fall
  # back on. The generator is written for this release of the tool.
  "pybind11-stubgen==2.5.5",
  "delocate>=0.13; sys_platform == 'darwin'",
]
build-backend = "backend"
backend-path = ["packaging"]

[project]
name = "sigil-sketch"
version = "0.1.0a9"
description = "Native Sigil drawing libraries and headless Python sketches"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["COPYING", "COPYING.LESSER"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Multimedia :: Graphics",
]

[project.scripts]
sigil = "sigil.cli:main"

[project.optional-dependencies]
studies = ["numpy>=2.0"]

[dependency-groups]
typing = ["basedpyright==1.40.1", "pybind11-stubgen==2.5.5"]

[tool.uv]
# An editable install reads .py from this project but installs the generated
# declarations, and maps only the modules present when it was built. A
# directory key answers for that directory alone, so every package directory
# is named: a module added or removed anywhere in the package rebuilds the
# install. The pass that writes the declarations is matched by glob instead,
# because what matters there is that a file changed, not that one appeared.
# A binding change rebuilds through the native sources.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "typing/*.py" },
  { file = "typing/*.pyi" },
  { file = "typing/**/*.py" },
  { file = "typing/**/*.pyi" },
  { dir = "sigil" },
  { dir = "sigil/compose" },
  { dir = "sigil/core" },
  { dir = "sigil/draw" },
  { dir = "sigil/draw/brush" },
  { dir = "sigil/examples" },
  { dir = "sigil/examples/tools" },
  { dir = "sigil/geometry" },
  { dir = "sigil/geometry/mesh" },
  { dir = "sigil/material" },
  { dir = "sigil/motion" },
  { dir = "sigil/sketch" },
  { dir = "sigil/weave" },
  { dir = "sigil/world" },
  { dir = "typing" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.31"
cmake.build-type = "Release"
cmake.source-dir = "native"
build.targets = ["sigil_python"]
install.components = ["SigilPython"]
wheel.packages = ["sigil"]
editable.mode = "redirect"
sdist.exclude = [
  "build*", "dist", ".venv*", "CMakeUserPresets.json",
  ".claude/**", ".codex/**", ".agents/**", "**/.DS_Store", "**/.qmlls.ini",
  "**/__pycache__/**", "**/*.pyc",
]

[tool.scikit-build.cmake.define]
CMAKE_DISABLE_FIND_PACKAGE_Ultralight = true
CMAKE_DISABLE_FIND_PACKAGE_Substance = true
