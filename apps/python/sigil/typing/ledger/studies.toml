# The bundled Python studies under Grimoire's sketches/, one record each:
# what the study combines and, where it ports or adapts a registered C++
# sketch, which one. Every python_*.py file there, and every python_<stem>/
# directory holding a python_<stem>.py, needs a record.

[study.python_alpha_ground]
combines = "A transparent ground under one turning mark, for a subscriber to composite"
ports = "alpha_ground"

[study.python_botanical_study]
combines = "Wash, dry mass, hatching and veins over ten leaves on a pressure-drawn branch"
adapts = "brush_botanical_study"

[study.python_bundled_type]
combines = "A font file the sketch carries, loaded through the session's hub and named by its family beside an installed one, with the bundled family read back as a specimen"

[study.python_compose_stamps]
combines = "Compose trees placed by a Draw pen and repeated as a custom brush tip"

[study.python_data_garden]
combines = "Native table sorting and domain scales over one illustrative CSV dataset"

[study.python_document]
combines = "One document under two inherited role stylesheets"
adapts = "document_styles"

[study.python_flipbook_fire]
combines = "A generated flame sheet played as a flipbook, coals moving along a flow map, embers each showing their own cell, a flickering light and bloom, baked on the device"
ports = "flipbook_fire"

[study.python_hello]
combines = "A greeting and a moving circle, with two constants to edit"

[study.python_hello_compose]
combines = "Python components, native kits, material paints and an entrance"

[study.python_instrument_board]
combines = "Immutable readings reported at a cadence and drawn through memo into keyed wells with kit meters, beside a 48-bar envelope entering on one stagger"

[study.python_kit_specimen]
combines = "Native layout schemes, page furniture and a memo that restores its scoped theme"

[study.python_layer_stack]
combines = "One draw.Stack built in setup: rings drawn with a layer's pen, words baked from a compose tree and squashed by a placement under a screen blend, a hatching masked by the words and a disc whose remove blend erases what lies beneath it as its placement circles"

[study.python_liquid_glass]
combines = "Runtime shader refraction, child slots, moving uniforms and Bezier filaments"
ports = "p5_refractive_metaballs"

[study.python_market_tape]
combines = "Two ordinary Python libraries, websockets and httpx, feeding a live page on the sketch's own event loop, replayed from JSON lines recordings for a capture"

[study.python_mixed_materials]
combines = "One Compose page of mixed materials on a baked sheet: carved stone type, brushed copper ribbons ending on plated vias, a pulse riding the bus in a live window, a crackled clear-coated glaze, velvet sheen, a thin film, an emissive mark, satin and matte, under a railed key, a drifting panel and a pulsing light"

[study.python_numpy_bridge]
combines = "A NumPy angle field drawn as one packed line batch beside a NumPy Gray–Scott reaction stepped at a fixed rate and drawn through one RGBA transfer, sampled nearest"
ports = "flow_fields"

[study.python_plaque]
combines = "One Compose page as the material of a baked plaque: stone, copper type raised on a rounded shoulder, a glowing rule and flat ink, lit by a moving key and a studio environment"

[study.python_text_fx]
combines = "A held scramble, keyframe stops naming a custom property and the ink, a tint by word, a sequence of an entrance and a squash, and a wave loop"

[study.python_type_atelier]
combines = "Mixed runs, inline slots, named selections, initial letters, balanced story frames and a curved baseline"

[study.python_world_study]
combines = "A lathed vessel, a parametric knot and a regular solid on three plinths under keyed scene nodes, three dielectric finishes and a moving three-point rig, with a Compose page of words laid over the frame, baked on the device"
