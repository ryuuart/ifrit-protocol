# The native surfaces a registered C++ sketch needs from Python beyond
# basic pen verbs, one record each. `native` is the C++ spelling the ledger
# prints while the surface is unbound; `library` groups it; `python` lists
# the Python spellings that must ALL resolve in the built extension for the
# surface to count as bound. A record with no `python` names no Python
# spelling yet and stays unbound until one is written here.
#
# A spelling is a dotted path under `sigil`. A trailing parenthesised list,
# `compose.text(paragraph)`, also requires an overload whose parameters
# begin with those names.

