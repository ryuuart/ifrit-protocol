# What each Python surface binds and what its native library has that
# Python cannot reach yet, grouped the way the ledger prints them.
#
# An item written `bound` is a claim in Python spelling: every name in its
# `python` list must resolve in the built extension, and generation stops,
# naming the item, when one does not. An item written `native` is a native
# surface in C++ spelling: it prints under Bound, as `bound_text` or as its
# Python names, once every name in its `python` list resolves, and under Not
# yet bound otherwise. An item with no `python` list states something no
# name can show and prints as written.
#
# `library` names each library with no Python binding at all: when every
# module it lists exports nothing, the ledger lists the requirements of that
# library and the sketches needing them.

