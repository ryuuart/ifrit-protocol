# What each registered C++ sketch needs, as an author audited it.
# `needs` summarises the native capabilities its source uses beyond basic
# pen verbs; `requires` names the records of requirements.toml a Python
# translation needs. Which of those are bound is read from the built
# extension, never written here. The collection a sketch files under is
# read from its registration.
#
# `collections` orders the ledger's collections; one it does not name
# follows them alphabetically.

collections = [
  "Start & fixtures",
  "Draw",
  "Draw · Generative",
  "Draw · Observable reproductions",
  "Draw · Procedural",
  "Kit · API",
  "Kit · Depth",
  "Compose · Typography",
  "Specimen",
  "Set",
  "Data",
  "Media",
  "Catalog · Type",
  "Catalog · Chrome",
  "Catalog · Game UI",
  "Catalog · Generative",
  "Catalog · Tiling",
  "Study · Type",
  "Study · Pattern",
  "Study · Paint",
  "Study · Motion",
  "Study · Film",
  "Study · Science",
  "Study · Esoteric",
  "Study · Screens",
  "Study · Game UI",
]

