# The documentation server. Static files only — no upstream, no state.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Doxygen writes UTF-8 and says so in each page's meta tag, but a
    # header that says otherwise wins over the meta tag in every browser.
    charset utf-8;

    # Doxygen's output is mostly HTML, CSS, JS and SVG — all text, and
    # all of it repetitive enough to compress well. The generated search
    # index is the largest single file in the tree.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml;

    # A library's site is one directory; asking for the directory should
    # land on its front page rather than a listing.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Every page of a Doxygen site is regenerated wholesale on each run,
    # so a cached asset can outlive the page that referenced it. Short
    # enough that a redeploy is visible on the next reload, long enough
    # that clicking through a site does not refetch the stylesheet.
    location ~* \.(css|js|svg|png|jpg|gif|woff2?)$ {
        expires   5m;
        add_header Cache-Control "public";
    }

    access_log off;
}
