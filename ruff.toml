# Lint and format policy for the repo's Python: the authoring package
# under apps/python and the tool scripts. Tuned to pass on the existing
# code — the tools police changes going forward; they do not restyle
# what already works.

# The practical ceiling of the existing code (most of it wraps near 80).
line-length = 88

extend-exclude = [
    # FlatBuffers output, owned by the flatbuffers verb. Regenerating
    # would silently discard any hand fix or reformat.
    "apps/python/spellcircle/SpellCircle/Box.py",
    "apps/python/spellcircle/SpellCircle/Circle.py",
    "apps/python/spellcircle/SpellCircle/Edge.py",
    "apps/python/spellcircle/SpellCircle/Point.py",
    "apps/python/spellcircle/SpellCircle/Scene.py",
    "apps/python/spellcircle/SpellCircle/Vec2.py",
    # Fragments the declaration generator splices into a module it writes.
    # Each one is completed by the re-exports spliced above it, so on its
    # own it names things nothing in the file defines.
    "apps/python/sigil/typing/additions/**",
    # Build trees carry generated and vendored Python.
    "apps/spell-circle-canvas/build*",
    "touchdesigner/venv*",
]

[lint]
# Existing patterns in this repository that the default rule set would
# flag wholesale. Each entry is a deliberate house habit, not an
# oversight; removing one from this list means fixing every place it
# fires first.
ignore = [
    "E401",    # compact one-line import blocks in the tool scripts
    "UP031",   # printf-style formatting
    "EXE001",  # shebang lines on scripts that are not chmod +x
    "SIM115",  # open() without a context manager
    "PLW1510", # subprocess.run without explicit check=
    "PLR1711", # bare trailing `return` (TouchDesigner callback stubs)
    "DTZ005",  # local-time datetime.now() — report timestamps are local
    "PYI034",  # __enter__ annotated with the concrete class, not Self
    "N999",    # the package directory is named SpellCircle, capital S
    "PIE810",  # consecutive startswith() calls
    "C408",    # dict(x=1) keyword-literal calls
]

[lint.per-file-ignores]
# TouchDesigner injects op/DAT/mod and friends into script globals at
# runtime; outside TouchDesigner they are undefined names. Its import
# block, like the two below, predates import sorting.
"touchdesigner/scripts/spell_circle.py" = ["F821", "I001"]
"apps/spell-circle-canvas/src/common/compose/test/assets/make_advance_variant_vf.py" = ["I001"]

[format]
# Grandfathered: these predate the formatter and diverge from its
# output (deliberately aligned literal tables, compact wrapping).
# Reformatting them is a separate decision from adopting the tool —
# until then they are lint-checked but not format-checked. New Python
# files are format-checked from birth; do not add to this list.
exclude = [
    "apps/spell-circle-canvas/src/common/compose/gallery/tools_gen_skill_tree_data.py",
    "apps/spell-circle-canvas/src/common/compose/test/assets/make_advance_variant_vf.py",
    "apps/spell-circle-canvas/src/common/compose/test/docs/api_doc_probes.py",
    "touchdesigner/scripts/configure_editors.py",
    "touchdesigner/scripts/spell_circle.py",
]
